    ##########################################################################################################
    # worldgen settings
    #--------------------------------------------------------------------------------------------------------#
    # World generation tuning for templates, flowers, ores, plants, and special features.
    ##########################################################################################################

    "worldgen settings" {
        # Multiplies BYG clustered plant and ground-cover patch attempts when generating new chunks, including reeds, shrubs, and forest floor plants. 1.0 is the default; 0 skips most scaled attempts. Increase gradually: this affects many features and adds generation work, while valid placement spots still limit results.
        # Min: 0.0
        # Max: 10.0
        D:clusterPlantAttemptMultiplier=1.0

        # Dimension IDs where BYG's surface and underground world features generate (structures, trees, plants, ground patches and overworld ores). Features still only appear in their matching biomes, so add a dimension here only if it uses BYG or vanilla overworld biomes. Kasai ore always generates in the Nether.
        I:featureDimensions <
            0
         >

        # Multiplies BYG flower patch placement attempts in matching biomes when generating new chunks. 1.0 is the default; 0 skips these attempts. Increase gradually: higher values add generation work but do not guarantee proportionally more flowers because placement needs valid spots.
        # Min: 0.0
        # Max: 10.0
        D:flowerAttemptMultiplier=1.0
        B:generateAlgaePatches=true
        B:generateDeadGrassClusters=true
        B:generateEnchantedVillage=true
        B:generateGlowcaneBlue=true
        B:generateGlowcanePink=true
        B:generateGlowcanePurple=true
        B:generateGlowcaneRed=true
        B:generateGoldenSpinedCactus=true
        B:generateKasaiOre=true
        B:generateLathariumOre=true
        B:generateLightBlueSand=true
        B:generateMinicactus=true
        B:generateMudDeposits=true
        B:generatePaloTrees=true
        B:generatePeatDeposits=true
        B:generatePeatgrass=true
        B:generatePendoriteOre=true
        B:generatePinkSand=true
        B:generatePricklyPear=true
        B:generatePurpleSand=true
        B:generateRockyGrass=true
        B:generateRockyGrassAlps=true
        B:generateRockySurfaceFeatures=true
        B:generateRockystone=true
        B:generateRockystone2=true
        B:generateSandygrass=true
        B:generateScoriaDeposits=true
        B:generateSepiniteDeposits=true
        B:generateShortDeadGrassClusters=true
        B:generateSoapstoneDeposits=true
        B:generateSodalite=true
        B:generateTamreliteOre=true

        # Kasai ore generation attempts relative to default. Multiplies the global underground deposit attempt setting; 0 disables attempts in new chunks.
        # Min: 0.0
        # Max: 10.0
        D:kasaiOreAttemptMultiplier=1.0

        # Latharium ore generation attempts relative to default. Multiplies the global underground deposit attempt setting; 0 disables attempts in new chunks.
        # Min: 0.0
        # Max: 10.0
        D:lathariumOreAttemptMultiplier=1.0

        # Pendorite ore generation attempts relative to default. Multiplies the global underground deposit attempt setting; 0 disables attempts in new chunks.
        # Min: 0.0
        # Max: 10.0
        D:pendoriteOreAttemptMultiplier=1.0

        # Multiplies attempts to replace vanilla sand with BYG coloured sand deposits in eligible biomes when generating new chunks. 1.0 is the default; 0 skips these attempts. More attempts add generation work and need suitable sand to replace.
        # Min: 0.0
        # Max: 10.0
        D:sandAttemptMultiplier=1.0

        # Scoria generation attempts relative to default. Multiplies the global underground deposit attempt setting; 0 disables attempts in new chunks.
        # Min: 0.0
        # Max: 10.0
        D:scoriaAttemptMultiplier=1.0

        # Highest Y level where scoria deposits can start. Must be at least the minimum Y.
        # Min: 1
        # Max: 255
        I:scoriaMaxY=14

        # Lowest Y level where scoria deposits can start.
        # Min: 1
        # Max: 255
        I:scoriaMinY=1

        # Sepinite generation attempts relative to default. Multiplies the global underground deposit attempt setting; 0 disables attempts in new chunks.
        # Min: 0.0
        # Max: 10.0
        D:sepiniteAttemptMultiplier=1.0

        # Highest Y level where sepinite deposits can start. Must be at least the minimum Y.
        # Min: 1
        # Max: 255
        I:sepiniteMaxY=119

        # Lowest Y level where sepinite deposits can start.
        # Min: 1
        # Max: 255
        I:sepiniteMinY=60

        # Tamrelite ore generation attempts relative to default. Multiplies the global underground deposit attempt setting; 0 disables attempts in new chunks.
        # Min: 0.0
        # Max: 10.0
        D:tamreliteOreAttemptMultiplier=1.0

        # Multiplies the per-chunk spawn chance of BYG template-based and related rare features in new chunks. 1.0 is the default; 0 skips these chance checks. Higher values cannot raise a chance above 100%.
        # Min: 0.0
        # Max: 10.0
        D:templateChanceMultiplier=1.0

        # Multiplies attempts for BYG underground deposits in new chunks, including ores, mud, peat, scoria, sepinite, and soapstone. 1.0 is the default; 0 skips these attempts. Ore-specific attempt multipliers also apply.
        # Min: 0.0
        # Max: 10.0
        D:undergroundDepositAttemptMultiplier=1.0

        # Multiplies the size of each BYG underground deposit vein in new chunks, including ores, mud, peat, scoria, sepinite, and soapstone. 1.0 is the default; the minimum is 0.1. This changes vein size, not the number of attempts.
        # Min: 0.1
        # Max: 10.0
        D:undergroundDepositVeinSizeMultiplier=1.0
    }

    ##########################################################################################################
    # creature settings
    #--------------------------------------------------------------------------------------------------------#
    # Behaviour tuning for BYG creatures.
    ##########################################################################################################

    "creature settings" {
        # Allow witches to spawn naturally on the surface of Weeping Witch Forest during the day.
        # When disabled, vanilla witch spawning rules and weight apply. Restart required after changing this setting.
        B:daytimeWitchesInWeepingWitchForest=true

        # Relative spawn weight for fungal zombies in Fungal Jungle. 20 is the default; 0 disables natural spawning. Restart required.
        # Min: 0
        # Max: 2147483647
        I:fungalZombieSpawnWeight=20

        # Average interval in ticks between kiwi forage attempts at night. Lower values make kiwis dig for worms more often.
        # Min: 1
        # Max: 2147483647
        I:kiwiForageAttemptInterval=120

        # Biome registry IDs where kiwis spawn naturally. Use 'registry_name' for BYG biomes or 'modid:registry_name' for other mods.
        # An empty list disables natural kiwi spawning. Restart required after changing this list.
        S:kiwiSpawnBiomes <
            byg_woodlands
            byg_great_oak_lowlands
            byg_deciduous_forest
         >

        # Relative spawn weight for kiwis in the configured biomes. Higher values make them more common; 25 is the default.
        # Set to 0 to disable natural kiwi spawning. Restart required.
        # Min: 0
        # Max: 2147483647
        I:kiwiSpawnWeight=25

        # Chance for a kiwi to find a worm when a forage action completes.
        # Min: 0.0
        # Max: 1.0
        D:kiwiWormFindChance=0.33
    }

